<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>sndstation</title>
<meta name="description" content="sndstation: handheld game consoles as music instruments. Coming soon.">
<meta name="color-scheme" content="dark">
<link rel="icon" type="image/png" href="favicon.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Pixelify+Sans:wght@400;600&family=Silkscreen&display=swap" rel="stylesheet">
<style>
  /* the splash's own colours (art/splash in sndstation/sndstation) */
  :root {
    --bg: #0c0d0f; --text: #e8e4dc; --cream: #fff4b8; --yellow: #ffe066;
    --orange: #ff6a00; --red: #f0481c; --purple: #5b268e; --teal: #00d4c8;
  }
  html { background: var(--bg); }
  body {
    margin: 0; min-height: 100vh; display: grid; place-items: center;
    padding: 32px 16px; box-sizing: border-box;
    color: var(--text); font: 20px/1.4 "Pixelify Sans", ui-monospace, monospace;
    text-align: center;
  }
  img { image-rendering: pixelated; display: block; margin: 0 auto; height: auto; }
  .sndy { width: 96px; }
  .wordmark { width: min(656px, 100%); margin-top: 24px; }
  .soon {
    font: 24px/1 Silkscreen, ui-monospace, monospace; color: var(--yellow);
    margin: 40px 0 32px; letter-spacing: 2px;
    animation: blink 1.1s steps(1) infinite;
  }
  @keyframes blink { 50% { opacity: 0 } }
  @media (prefers-reduced-motion: reduce) { .soon { animation: none } }
  p { max-width: 30em; margin: 0 auto 12px; }
  .what { color: var(--cream); }
  .on { color: #9a8fb0; font-size: 17px; }
  a { color: var(--teal); text-decoration: none; border-bottom: 2px solid var(--purple); }
  a:hover { color: var(--cream); border-bottom-color: var(--orange); }
  footer { margin-top: 40px; font: 13px Silkscreen, ui-monospace, monospace; color: #6d6680; }
</style>
</head>
<body>
<main>
  <img class="sndy" src="sndy-bop.gif" width="96" height="136" alt="Sndy, the sndstation mascot, bopping in headphones">
  <img class="wordmark" src="sndstation-logo.png" width="656" height="72" alt="sndstation">
  <div class="soon">Coming soon</div>
  <p class="what">Handheld game consoles, turned into music instruments.</p>
  <p class="on">Debian on the RG35XX, RG351, RG353, TrimUI Brick and friends.
     MIDI 2.0 over the USB cable, a real-time kernel, plugins in the launcher.</p>
  <footer><a href="https://github.com/sndstation">github.com/sndstation</a></footer>
</main>
</body>
</html>
